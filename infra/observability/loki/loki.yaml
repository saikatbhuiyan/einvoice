# Single-binary Loki (every component in one process) on local filesystem storage. Fine for one
# host; a multi-host deployment would switch `common.storage` to object storage (S3) and run the
# read/write/backend targets separately -- the log pipeline in front of it doesn't change.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days
  # Lets Alloy attach trace_id/span_id per line without making them index labels (one label value
  # per trace would explode the index).
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
