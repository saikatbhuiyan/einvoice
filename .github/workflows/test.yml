name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, type-check, and unit/transport/contract specs — no Docker needed.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many --target=lint,type-check,test --all

  # Testcontainers (Redis, Postgres, MongoDB, s3mock) + a real Chromium. Hosted Ubuntu runners
  # ship both Docker and Google Chrome.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many --target=integration --all --parallel=1

  # services/mail, including the consumer half of the Kafka contract
  # (fixtures under libs/transports/src/contracts/kafka).
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/mail/go.mod
          cache-dependency-path: services/mail/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

# E2E (apps/bff-e2e) and load (load-tests/) need the full compose stack plus Keycloak and stay
# manual: `pnpm e2e`, `pnpm load:bff`.
