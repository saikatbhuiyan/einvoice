# Observability overlay: logs (Alloy -> Loki), metrics (OpenTelemetry -> Prometheus), traces
# (OpenTelemetry -> Tempo), all in Grafana. Layer it on top of either base file -- the base files
# stay unchanged and the apps run exactly as before without it (telemetry stays off unless the
# OTEL_* variables below are set):
#
#   docker compose -f docker-compose.dev.yml  -f docker-compose.observability.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Grafana: http://localhost:${GRAFANA_PORT:-3000} (admin / $GRAFANA_ADMIN_PASSWORD).
# Prometheus: http://localhost:${PROMETHEUS_PORT:-9095} (not 9090: dev's s3mock already has it).
# Both are bound to 127.0.0.1 only -- on a remote host reach them through an SSH tunnel rather
# than exposing them publicly. Loki, Alloy and Tempo publish no ports at all.

x-observed-node-service: &observed-node-service
  environment:
    # One JSON object per line on stdout for Alloy to parse; pino-pretty's colored text can't be.
    LOG_PRETTY: "false"
    # Traces: OTLP/HTTP to Tempo (the exporter appends /v1/traces).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    # Metrics: a Prometheus endpoint on each service's internal port 9464, scraped by prometheus.
    OTEL_METRICS_EXPORTER: prometheus
    OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
    # Every trace in dev. In production, sample instead, e.g. OTEL_TRACES_SAMPLER=parentbased_traceidratio
    # with OTEL_TRACES_SAMPLER_ARG=0.1 -- parent-based so a trace is kept or dropped whole, never split.
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  bff: *observed-node-service
  invoice: *observed-node-service
  product: *observed-node-service
  user-access: *observed-node-service
  authorizer: *observed-node-service
  pdf-generator: *observed-node-service
  media: *observed-node-service
  payment: *observed-node-service

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    # No healthcheck: the image is distroless (no shell, wget, or curl) and the loki binary has no
    # probe subcommand. Nothing needs one -- Alloy buffers and retries pushes with backoff until
    # Loki's /ready passes, and Grafana just shows "no data" until then.
    networks:
      - backend

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only socket access is how Alloy discovers containers and reads their logs. It's still
      # a privileged mount (the Docker API can do more than read) -- the same trade-off the dev
      # autoheal sidecar makes; on Kubernetes this is replaced by reading /var/log/pods instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - backend

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # No healthcheck, same as Loki: a distroless image with nothing to probe /ready with. The
    # apps' exporters buffer and retry, so they don't need Tempo up before they start.
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Tempo's metrics-generator pushes service-graph and span metrics in.
      - --web.enable-remote-write-receiver
      # Keeps the trace ids Tempo attaches to latency samples, so a Grafana latency panel can
      # jump straight to an example slow trace.
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9095}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      # edge for the published port, as with Grafana.
      - backend
      - edge

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    networks:
      # backend to query Loki/Prometheus/Tempo; edge so the published port is reachable (prod's
      # backend network is internal-only, which blocks published ports).
      - backend
      - edge

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  alloy_data:
  grafana_data:
