    working_dir: /app
    command: ["pnpm", "nx", "serve", "authorizer"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      AUTHORIZER_HTTP_PORT: ${AUTHORIZER_HTTP_PORT:-3309}
      AUTHORIZER_GRPC_PORT: ${AUTHORIZER_GRPC_PORT:-3307}
      USER_ACCESS_GRPC_HOST: user-access
      USER_ACCESS_GRPC_PORT: ${USER_ACCESS_GRPC_PORT:-3308}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
      user-access:
        condition: service_healthy
    ports:
      - "${AUTHORIZER_HTTP_PORT:-3309}:${AUTHORIZER_HTTP_PORT:-3309}"
      - "${AUTHORIZER_GRPC_PORT:-3307}:${AUTHORIZER_GRPC_PORT:-3307}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.AUTHORIZER_HTTP_PORT || 3309) + '/' + (process.env.GLOBAL_PREFIX || 'api') + '/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  pdf-generator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        APP_NAME: pdf-generator
    image: einvoice/pdf-generator:dev
    labels:
      autoheal: "true"
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "pdf-generator"]
    environment:
