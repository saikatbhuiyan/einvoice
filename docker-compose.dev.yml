name: einvoice-dev

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/bff:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "bff"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: ${BFF_PORT:-3300}
      INVOICE_SERVICE_HOST: invoice
      PRODUCT_SERVICE_HOST: product
      USER_SERVICE_HOST: user-access
      PAYMENT_SERVICE_HOST: payment
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3004}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
      DATABASE_URL: postgresql://${POSTGRES_USER:-einvoice_dev_user}:${POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-einvoice_dev}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-einvoice_dev_root}:${MONGO_ROOT_PASSWORD:-dev-mongo-password}@mongodb:27017/${MONGO_DB:-einvoice_dev}?authSource=admin
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-einvoice}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-einvoice-bff}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-keycloak-bff-secret}
      KEYCLOAK_REDIRECT_URI: http://localhost:${BFF_PORT:-3300}/${GLOBAL_PREFIX:-api}/v1/auth/callback
      AUTHORIZER_GRPC_HOST: authorizer
      AUTHORIZER_GRPC_PORT: ${AUTHORIZER_GRPC_PORT:-3307}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      invoice:
        condition: service_started
      product:
        condition: service_started
      user-access:
        condition: service_started
      authorizer:
        condition: service_started
      payment:
        condition: service_started
    ports:
      - "${BFF_PORT:-3300}:${BFF_PORT:-3300}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PORT || 3300) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - edge
      - backend

  invoice:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/invoice:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "invoice"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: ${INVOICE_HTTP_PORT:-3302}
      INVOICE_SERVICE_HOST: 0.0.0.0
      INVOICE_SERVICE_PORT: ${INVOICE_SERVICE_PORT:-3301}
      PDF_GENERATOR_SERVICE_HOST: pdf-generator
      PDF_GENERATOR_SERVICE_PORT: ${PDF_GENERATOR_SERVICE_PORT:-3310}
      MEDIA_SERVICE_HOST: media
      MEDIA_SERVICE_PORT: ${MEDIA_SERVICE_PORT:-3312}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-einvoice_dev_user}:${POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-einvoice_dev}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-einvoice_dev_root}:${MONGO_ROOT_PASSWORD:-dev-mongo-password}@mongodb:27017/${MONGO_DB:-einvoice_dev}?authSource=admin
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      pdf-generator:
        condition: service_started
      media:
        condition: service_started
    ports:
      - "${INVOICE_HTTP_PORT:-3302}:${INVOICE_HTTP_PORT:-3302}"
      - "${INVOICE_SERVICE_PORT:-3301}:${INVOICE_SERVICE_PORT:-3301}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PORT || 3302) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  product:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/product:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["sh", "-c", "pnpm product:migration:run && pnpm nx serve product"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PRODUCT_HTTP_PORT: ${PRODUCT_HTTP_PORT:-3303}
      PRODUCT_SERVICE_HOST: 0.0.0.0
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT:-3304}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PRODUCT_HTTP_PORT:-3303}:${PRODUCT_HTTP_PORT:-3303}"
      - "${PRODUCT_SERVICE_PORT:-3304}:${PRODUCT_SERVICE_PORT:-3304}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PRODUCT_HTTP_PORT || 3303) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  user-access:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/user-access:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["sh", "-c", "pnpm user-access:migration:run && pnpm nx run user-access:seed-roles && pnpm nx serve user-access"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      USER_ACCESS_HTTP_PORT: ${USER_ACCESS_HTTP_PORT:-3305}
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-3306}
      USER_ACCESS_GRPC_PORT: ${USER_ACCESS_GRPC_PORT:-3308}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-einvoice}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-einvoice-admin-cli}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-dev-keycloak-admin-cli-secret}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${USER_ACCESS_HTTP_PORT:-3305}:${USER_ACCESS_HTTP_PORT:-3305}"
      - "${USER_SERVICE_PORT:-3306}:${USER_SERVICE_PORT:-3306}"
      - "${USER_ACCESS_GRPC_PORT:-3308}:${USER_ACCESS_GRPC_PORT:-3308}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.USER_ACCESS_HTTP_PORT || 3305) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  authorizer:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/authorizer:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "authorizer"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      AUTHORIZER_HTTP_PORT: ${AUTHORIZER_HTTP_PORT:-3309}
      AUTHORIZER_GRPC_PORT: ${AUTHORIZER_GRPC_PORT:-3307}
      USER_ACCESS_GRPC_HOST: user-access
      USER_ACCESS_GRPC_PORT: ${USER_ACCESS_GRPC_PORT:-3308}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
      user-access:
        condition: service_healthy
    ports:
      - "${AUTHORIZER_HTTP_PORT:-3309}:${AUTHORIZER_HTTP_PORT:-3309}"
      - "${AUTHORIZER_GRPC_PORT:-3307}:${AUTHORIZER_GRPC_PORT:-3307}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.AUTHORIZER_HTTP_PORT || 3309) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  pdf-generator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/pdf-generator:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "pdf-generator"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PDF_GENERATOR_HTTP_PORT: ${PDF_GENERATOR_HTTP_PORT:-3311}
      PDF_GENERATOR_SERVICE_HOST: 0.0.0.0
      PDF_GENERATOR_SERVICE_PORT: ${PDF_GENERATOR_SERVICE_PORT:-3310}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${PDF_GENERATOR_HTTP_PORT:-3311}:${PDF_GENERATOR_HTTP_PORT:-3311}"
      - "${PDF_GENERATOR_SERVICE_PORT:-3310}:${PDF_GENERATOR_SERVICE_PORT:-3310}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PDF_GENERATOR_HTTP_PORT || 3311) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  media:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/media:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "media"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      MEDIA_HTTP_PORT: ${MEDIA_HTTP_PORT:-3313}
      MEDIA_SERVICE_HOST: 0.0.0.0
      MEDIA_SERVICE_PORT: ${MEDIA_SERVICE_PORT:-3312}
      S3_BUCKET: ${S3_BUCKET:-einvoice-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:${S3MOCK_PORT:-9090}/${S3_BUCKET:-einvoice-dev}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      s3mock-init:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_HTTP_PORT:-3313}:${MEDIA_HTTP_PORT:-3313}"
      - "${MEDIA_SERVICE_PORT:-3312}:${MEDIA_SERVICE_PORT:-3312}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.MEDIA_HTTP_PORT || 3313) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: einvoice/payment:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["sh", "-c", "pnpm payment:migration:run && pnpm nx serve payment"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PAYMENT_HTTP_PORT: ${PAYMENT_HTTP_PORT:-3314}
      PAYMENT_SERVICE_HOST: 0.0.0.0
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3004}
      INVOICE_SERVICE_HOST: invoice
      INVOICE_SERVICE_PORT: ${INVOICE_SERVICE_PORT:-3301}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3300/api/v1/payments/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3300/api/v1/payments/cancel}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      invoice:
        condition: service_started
    ports:
      - "${PAYMENT_HTTP_PORT:-3314}:${PAYMENT_HTTP_PORT:-3314}"
      - "${PAYMENT_SERVICE_PORT:-3004}:${PAYMENT_SERVICE_PORT:-3004}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PAYMENT_HTTP_PORT || 3314) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  # S3-compatible stand-in for dev. MinIO was the original choice (see media's S3Configuration
  # comments); LocalStack was the next one tried. Both now gate their easy-to-pull images behind a
  # paid license as of their respective 2025/2026 licensing changes -- confirmed live (anonymous
  # pulls of minio/minio and quay.io/minio/minio both 401; localstack/localstack:latest pulls fine
  # but refuses to start at all without a LOCALSTACK_AUTH_TOKEN). adobe/s3mock is a small,
  # genuinely open-source (Apache-2.0) S3 test double with no such gate. media's S3Configuration is
  # generic (any S3-compatible endpoint), so swapping the dev backend needed no application code
  # changes, only this service block. `initialBuckets` pre-creates the dev bucket on boot --
  # equivalent to minio-init's `mc mb`/LocalStack's init-hook script, with no sidecar needed.
  s3mock:
    image: adobe/s3mock:latest
    restart: unless-stopped
    ports:
      - "${S3MOCK_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  # s3mock's documented initialBuckets env var didn't take effect in practice (confirmed live --
  # the bucket never showed up in a ListBuckets call), so this one-shot sidecar creates it the
  # same way a real client would: a plain `PUT /{bucket}` against the S3 REST API, which s3mock
  # accepts unauthenticated.
  s3mock-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    # s3mock has no persistent volume, but `up` without --force-recreate reuses the still-running
    # container from a previous `up` -- so the bucket may already exist. Idempotent either way:
    # created now (2xx) or already there from last time (409) both leave the bucket usable; only a
    # genuine connection failure should fail this step, which curl's own exit code already covers.
    command:
      - "curl -s -o /dev/null -w '%{http_code}' -X PUT http://s3mock:9090/${S3_BUCKET:-einvoice-dev}"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-dev-redis-password}",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einvoice_dev_user} -d ${POSTGRES_DB:-einvoice_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@einvoice.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dev-pgadmin-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-keycloak-admin-password}
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import
      - keycloak_dev_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - backend

  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-einvoice_dev_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev-mongo-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-einvoice_dev}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USERNAME:-einvoice_dev_root} --password ${MONGO_ROOT_PASSWORD:-dev-mongo-password} --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

