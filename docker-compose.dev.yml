      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PDF_GENERATOR_HTTP_PORT: ${PDF_GENERATOR_HTTP_PORT:-3311}
      PDF_GENERATOR_SERVICE_HOST: 0.0.0.0
      PDF_GENERATOR_SERVICE_PORT: ${PDF_GENERATOR_SERVICE_PORT:-3310}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${PDF_GENERATOR_HTTP_PORT:-3311}:${PDF_GENERATOR_HTTP_PORT:-3311}"
      - "${PDF_GENERATOR_SERVICE_PORT:-3310}:${PDF_GENERATOR_SERVICE_PORT:-3310}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PDF_GENERATOR_HTTP_PORT || 3311) + '/' + (process.env.GLOBAL_PREFIX || 'api') + '/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  media:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        APP_NAME: media
    image: einvoice/media:dev
    labels:
      autoheal: "true"
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["pnpm", "nx", "serve", "media"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      MEDIA_HTTP_PORT: ${MEDIA_HTTP_PORT:-3313}
      MEDIA_SERVICE_HOST: 0.0.0.0
      MEDIA_SERVICE_PORT: ${MEDIA_SERVICE_PORT:-3312}
      S3_BUCKET: ${S3_BUCKET:-einvoice-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_FORCE_PATH_STYLE: "true"
      # Presigned download URLs are signed for this host -- the one a browser on the host reaches.
      S3_PUBLIC_ENDPOINT: http://localhost:${S3MOCK_PORT:-9090}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      s3mock-init:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_HTTP_PORT:-3313}:${MEDIA_HTTP_PORT:-3313}"
      - "${MEDIA_SERVICE_PORT:-3312}:${MEDIA_SERVICE_PORT:-3312}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.MEDIA_HTTP_PORT || 3313) + '/' + (process.env.GLOBAL_PREFIX || 'api') + '/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        APP_NAME: payment
    image: einvoice/payment:dev
    labels:
      autoheal: "true"
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    working_dir: /app
    command: ["sh", "-c", "pnpm payment:migration:run && pnpm nx serve payment"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PAYMENT_HTTP_PORT: ${PAYMENT_HTTP_PORT:-3314}
      PAYMENT_SERVICE_HOST: 0.0.0.0
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3004}
      INVOICE_SERVICE_HOST: invoice
      # invoice.events consumer (InvoiceEventsController).
      KAFKA_BROKERS: kafka:9092
      INVOICE_SERVICE_PORT: ${INVOICE_SERVICE_PORT:-3301}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3300/api/v1/payments/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3300/api/v1/payments/cancel}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      invoice:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${PAYMENT_HTTP_PORT:-3314}:${PAYMENT_HTTP_PORT:-3314}"
      - "${PAYMENT_SERVICE_PORT:-3004}:${PAYMENT_SERVICE_PORT:-3004}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PAYMENT_HTTP_PORT || 3314) + '/' + (process.env.GLOBAL_PREFIX || 'api') + '/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  # S3-compatible stand-in for dev. MinIO was the original choice (see media's S3Configuration
  # comments); LocalStack was the next one tried. Both now gate their easy-to-pull images behind a
  # paid license as of their respective 2025/2026 licensing changes -- confirmed live (anonymous
  # pulls of minio/minio and quay.io/minio/minio both 401; localstack/localstack:latest pulls fine
  # but refuses to start at all without a LOCALSTACK_AUTH_TOKEN). adobe/s3mock is a small,
  # genuinely open-source (Apache-2.0) S3 test double with no such gate. media's S3Configuration is
  # generic (any S3-compatible endpoint), so swapping the dev backend needed no application code
  # changes, only this service block. `initialBuckets` pre-creates the dev bucket on boot --
  # equivalent to minio-init's `mc mb`/LocalStack's init-hook script, with no sidecar needed.
  s3mock:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    ports:
      - "${S3MOCK_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  # s3mock's documented initialBuckets env var didn't take effect in practice (confirmed live --
  # the bucket never showed up in a ListBuckets call), so this one-shot sidecar creates it the
  # same way a real client would: a plain `PUT /{bucket}` against the S3 REST API, which s3mock
  # accepts unauthenticated.
  s3mock-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    # s3mock has no persistent volume, but `up` without --force-recreate reuses the still-running
    # container from a previous `up` -- so the bucket may already exist. Idempotent either way:
    # created now (2xx) or already there from last time (409) both leave the bucket usable; only a
    # genuine connection failure should fail this step, which curl's own exit code already covers.
    command:
      - "curl -s -o /dev/null -w '%{http_code}' -X PUT http://s3mock:9090/${S3_BUCKET:-einvoice-dev}"
    networks:
      - backend

  # Official Apache Software Foundation image, KRaft mode (no Zookeeper) -- confirmed anonymously
  # pullable live, unlike this same week's MinIO/LocalStack surprises. Touching ANY KAFKA_* env
  # var switches this image's entrypoint from "zero-config single-node defaults" to "fully manual
  # KRaft config required" -- confirmed live the hard way (a single KAFKA_ADVERTISED_LISTENERS
  # override alone fails at boot with "Missing required configuration process.roles"), so this is
  # the complete minimum set, not a partial override. KAFKA_ADVERTISED_LISTENERS has to be the
  # compose service name (not the image's own "localhost" default), or every *other* container
  # that successfully bootstraps against this broker gets redirected back to its own localhost on
  # every subsequent request and never actually reaches Kafka -- confirmed live, this exact
  # failure mode, before adding this override. OFFSETS_TOPIC/TRANSACTION_STATE_LOG replication
  # factors are 1 because this is a single broker; Kafka's own default of 3 makes the internal
  # __consumer_offsets topic fail to initialize on a 1-broker cluster, which surfaces to every
  # consumer as an opaque "Group Coordinator Not Available" error until fixed.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics exist only if infra/kafka/topics.conf lists them (kafka-init creates them): with
      # auto-creation, the first consumer on a fresh broker raced the creation and payment failed to start.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The volume's path. Unset, the image's env-based config writes to /tmp/kafka-logs -- the
      # container's own layer -- so every recreate silently dropped all topics, unconsumed events and
      # consumer-group offsets while the mounted volume stayed empty.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_dev_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # One-shot: creates every topic in infra/kafka/topics.conf that doesn't exist yet, then exits.
  # invoice, payment and mail-service start only after it completed successfully.
  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./infra/kafka:/topics:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  mail-service:
    build:
      context: ./services/mail
      dockerfile: Dockerfile
    image: einvoice/mail:dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      APP_ENV: ${NODE_ENV:-development}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_INVOICE_EVENTS: invoice.events
      KAFKA_CONSUMER_GROUP: mail-service
      # Messages that can never be processed (malformed, PDF missing) land here with the error in
      # their headers, instead of blocking the partition or being dropped.
      KAFKA_TOPIC_INVOICE_EVENTS_DLQ: invoice.events.dlq
      # Dedupe store: which events already produced an email (delivery is at-least-once).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      # The private bucket media writes invoice PDFs to; the event carries the key, not a URL.
      S3_BUCKET: ${S3_BUCKET:-einvoice-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://s3mock:9090
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      # Defaults deliver to the local Mailpit sink (plaintext, no auth; read mail at
      # http://127.0.0.1:8025). These `${...}` values come from the shell or the root .env -- NOT from
      # .env.dev: `environment` overrides `env_file`, so SMTP settings in .env.dev never reached this
      # container. For a real relay (Gmail), set SMTP_HOST/PORT/USERNAME/PASSWORD/FROM and
      # SMTP_TLS_POLICY=mandatory in the root .env or the shell.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS_POLICY: ${SMTP_TLS_POLICY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-invoices@einvoice.local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3mock-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    networks:
      - backend

  # Local SMTP sink, dev only: every email mail-service sends lands here, readable at
  # http://127.0.0.1:8025. Healthcheck comes with the image (`mailpit readyz`).
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend

  # Docker Engine does NOT restart a container for being unhealthy -- `restart: unless-stopped`
  # only reacts to the process exiting. autoheal closes that gap: it watches containers labeled
  # autoheal=true and restarts any whose healthcheck (each app's /api/health/live) is failing.
  # It needs the Docker socket, which is root-equivalent on the host -- fine for local dev, not
  # for prod, where the orchestrator's liveness probe pointed at /api/health/live does this job.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-dev-redis-password}",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-einvoice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einvoice_dev_user} -d ${POSTGRES_DB:-einvoice_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@einvoice.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dev-pgadmin-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Recent pgadmin images reject special-use domains like `.local` as the login email and
      # refuse to boot. Allow it explicitly (a Python literal, as pgadmin's config expects) so the
      # dev default above keeps working.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-keycloak-admin-password}
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import
      - keycloak_dev_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - backend

  # Single-node replica set, not standalone: invoice's transactional outbox needs multi-document
  # transactions, which MongoDB only offers on a replica set (as every managed production MongoDB
  # is). Auth + --replSet requires a keyFile for member-to-member auth; with one member nothing
  # else ever presents it, so a fresh one is generated at each start instead of being stored.
  # The healthcheck initiates the set on first boot (idempotent) and reports healthy only once this
  # node is a writable primary. An existing standalone volume converts in place.
  # Clients outside the compose network can't resolve the member host "mongodb", so host-run apps
  # connect with MONGODB_DIRECT_CONNECTION=true (see .env.dev.example).
  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-einvoice_dev_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev-mongo-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-einvoice_dev}
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile && chown 999:999 /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USERNAME:-einvoice_dev_root} --password ${MONGO_ROOT_PASSWORD:-dev-mongo-password} --authenticationDatabase admin --eval \"try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) } db.hello().isWritablePrimary ? 1 : 0\" | grep 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_dev_data:
  pgadmin_dev_data:
  mongodb_dev_data:
  redis_dev_data:
  keycloak_dev_data:
  kafka_dev_data:
  pnpm_store:
  node_modules:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
