name: einvoice-prod

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: bff
    image: einvoice/bff:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      PORT: ${BFF_PORT:-3300}
      INVOICE_SERVICE_HOST: invoice
      PRODUCT_SERVICE_HOST: product
      USER_SERVICE_HOST: user-access
      PAYMENT_SERVICE_HOST: payment
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3004}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
      DATABASE_URL: postgresql://${POSTGRES_USER:-einvoice_user}:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/${POSTGRES_DB:-einvoice}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-einvoice_root}:${MONGO_ROOT_PASSWORD:-change-me-mongo-password}@mongodb:27017/${MONGO_DB:-einvoice}?authSource=admin
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-https://auth.example.com}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-einvoice}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-einvoice-bff}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-keycloak-bff-secret}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-https://app.example.com/api/v1/auth/callback}
      AUTHORIZER_GRPC_HOST: authorizer
      AUTHORIZER_GRPC_PORT: ${AUTHORIZER_GRPC_PORT:-3307}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      invoice:
        condition: service_started
      product:
        condition: service_started
      user-access:
        condition: service_started
      authorizer:
        condition: service_started
      payment:
        condition: service_started
    ports:
      - "${BFF_PORT:-3300}:${BFF_PORT:-3300}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PORT || 3300) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - edge
      - backend

  invoice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: invoice
    image: einvoice/invoice:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      PORT: ${INVOICE_HTTP_PORT:-3302}
      INVOICE_SERVICE_HOST: 0.0.0.0
      PDF_GENERATOR_SERVICE_HOST: pdf-generator
      PDF_GENERATOR_SERVICE_PORT: ${PDF_GENERATOR_SERVICE_PORT:-3310}
      MEDIA_SERVICE_HOST: media
      MEDIA_SERVICE_PORT: ${MEDIA_SERVICE_PORT:-3312}
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-einvoice_user}:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/${POSTGRES_DB:-einvoice}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-einvoice_root}:${MONGO_ROOT_PASSWORD:-change-me-mongo-password}@mongodb:27017/${MONGO_DB:-einvoice}?authSource=admin
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pdf-generator:
        condition: service_started
      media:
        condition: service_started
    expose:
      - "${INVOICE_SERVICE_PORT:-3301}"
      - "${INVOICE_HTTP_PORT:-3302}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PORT || 3302) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  product:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product
    image: einvoice/product:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PRODUCT_HTTP_PORT: ${PRODUCT_HTTP_PORT:-3303}
      PRODUCT_SERVICE_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${PRODUCT_HTTP_PORT:-3303}"
      - "${PRODUCT_SERVICE_PORT:-3304}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PRODUCT_HTTP_PORT || 3303) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  user-access:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user-access
    image: einvoice/user-access:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      USER_ACCESS_HTTP_PORT: ${USER_ACCESS_HTTP_PORT:-3305}
      USER_SERVICE_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-einvoice}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-einvoice-admin-cli}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me-keycloak-admin-cli-secret}
      USER_ACCESS_GRPC_PORT: ${USER_ACCESS_GRPC_PORT:-3308}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "${USER_ACCESS_HTTP_PORT:-3305}"
      - "${USER_SERVICE_PORT:-3306}"
      - "${USER_ACCESS_GRPC_PORT:-3308}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.USER_ACCESS_HTTP_PORT || 3305) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  authorizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: authorizer
    image: einvoice/authorizer:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      AUTHORIZER_HTTP_PORT: ${AUTHORIZER_HTTP_PORT:-3309}
      AUTHORIZER_GRPC_PORT: ${AUTHORIZER_GRPC_PORT:-3307}
      USER_ACCESS_GRPC_HOST: user-access
      USER_ACCESS_GRPC_PORT: ${USER_ACCESS_GRPC_PORT:-3308}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-20}
    depends_on:
      redis:
        condition: service_healthy
      user-access:
        condition: service_healthy
    expose:
      - "${AUTHORIZER_HTTP_PORT:-3309}"
      - "${AUTHORIZER_GRPC_PORT:-3307}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.AUTHORIZER_HTTP_PORT || 3309) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  pdf-generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: pdf-generator
    image: einvoice/pdf-generator:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PDF_GENERATOR_HTTP_PORT: ${PDF_GENERATOR_HTTP_PORT:-3311}
      PDF_GENERATOR_SERVICE_HOST: 0.0.0.0
    expose:
      - "${PDF_GENERATOR_HTTP_PORT:-3311}"
      - "${PDF_GENERATOR_SERVICE_PORT:-3310}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PDF_GENERATOR_HTTP_PORT || 3311) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  media:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: media
    image: einvoice/media:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      MEDIA_HTTP_PORT: ${MEDIA_HTTP_PORT:-3313}
      MEDIA_SERVICE_HOST: 0.0.0.0
      # No S3_ENDPOINT, S3_ACCESS_KEY_ID, or S3_SECRET_ACCESS_KEY here -- unlike dev's s3mock
      # stand-in, production talks to real AWS S3 (S3_ENDPOINT unset) via whatever IAM role this
      # container's host/task already has (see apps/media's S3Configuration and
      # S3StorageProvider), not a static key pair. S3_BUCKET/S3_REGION/S3_PUBLIC_BASE_URL come
      # from .env.prod like everything else below.
    expose:
      - "${MEDIA_HTTP_PORT:-3313}"
      - "${MEDIA_SERVICE_PORT:-3312}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.MEDIA_HTTP_PORT || 3313) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: payment
    image: einvoice/payment:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api}
      PAYMENT_HTTP_PORT: ${PAYMENT_HTTP_PORT:-3314}
      PAYMENT_SERVICE_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    depends_on:
      postgres:
        condition: service_healthy
      invoice:
        condition: service_started
    expose:
      - "${PAYMENT_HTTP_PORT:-3314}"
      - "${PAYMENT_SERVICE_PORT:-3004}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const socket = net.connect({ host: '127.0.0.1', port: Number(process.env.PAYMENT_HTTP_PORT || 3314) }, () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  # Self-hosted, single-broker Kafka -- fine at this project's scale. At real production
  # scale/HA requirements this is the kind of infra piece that's more commonly a managed service
  # (MSK, Confluent Cloud) rather than a self-run container, the same "provisioned by hand outside
  # this compose file" category docker-compose.prod.yml's own keycloak service note already
  # documents for the realm/clients. See docker-compose.dev.yml's kafka service comment for why
  # every one of these KAFKA_* vars is required together, not optional tuning.
  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # No `expose`/healthcheck here, unlike every other service in this file -- this container makes
  # only outbound connections (to kafka, and to SES/SMTP/the PDF URL), never receives inbound
  # traffic from anyone, and its scratch-based image (see services/mail/Dockerfile) has no shell
  # at all for a CMD-SHELL healthcheck to run even if it needed one.
  mail-service:
    build:
      context: ./services/mail
      dockerfile: Dockerfile
    image: einvoice/mail:prod
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      APP_ENV: ${NODE_ENV:-production}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_INVOICE_EVENTS: invoice.events
      KAFKA_CONSUMER_GROUP: mail-service
      MAIL_PROVIDER: ${MAIL_PROVIDER:-ses}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-change-me-redis-password}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  postgres:
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einvoice_user} -d ${POSTGRES_DB:-einvoice}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-einvoice_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-mongo-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-einvoice}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USERNAME:-einvoice_root} --password ${MONGO_ROOT_PASSWORD:-change-me-mongo-password} --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-keycloak-admin-password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # No TLS termination happens inside this compose file for any service (bff has none either)
      # — same single-host assumption as the rest of it: whatever sits in front of these published
      # ports (a cloud load balancer, a separately managed reverse proxy) terminates TLS and
      # forwards plain HTTP. hostname-strict=false lets Keycloak build correct URLs from whatever
      # Host header it actually receives instead of demanding an exact match up front.
      KC_HOSTNAME_STRICT: "false"
    # Deliberately no --import-realm and no mount of infra/keycloak/realm-export here — that file
    # is a dev-only convenience fixture: it hardcodes a client secret and two test users with a
    # publicly-known password (both live in this repo's git history). Auto-importing it into
    # "production" would mean Keycloak actually stores those exact dev credentials, silently
    # ignoring whatever real KEYCLOAK_CLIENT_SECRET an operator sets via env — bff would then fail
    # to authenticate against the real secret it's configured with, and the dev test accounts
    # would exist with known passwords. The einvoice-bff and einvoice-admin-cli clients, and every
    # real user, need to be created here deliberately (console or Admin REST API) with real
    # secrets once, the same one-time step any production Keycloak realm needs regardless of what
    # app is fronting it.
    command: ["start"]
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - edge
      - backend

volumes:
  postgres_data:
  mongodb_data:
  keycloak_data:
  redis_data:
  kafka_prod_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
